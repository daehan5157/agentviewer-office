<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentviewer 접속</title>
<style>
  :root { --bg: #17131f; --card: #221c30; --line: #3a3150; --fg: #ece8f4; --mut: #a39cb6; --acc: #7c5cff; --err: #ff7a7a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f3fb; --card: #fff; --line: #ddd5ea; --fg: #241d33; --mut: #6d6582; --acc: #5b3fd6; --err: #c62828; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, 'Malgun Gothic', sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--mut); font-size: 13px; }
  input { font: 600 28px ui-monospace, Consolas, monospace; letter-spacing: 8px; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); width: 100%; }
  input:focus { outline: 2px solid var(--acc); border-color: transparent; }
  button { font: 600 15px system-ui, sans-serif; padding: 11px; border: 0; border-radius: 10px; background: var(--acc); color: #fff; cursor: pointer; }
  .err { color: var(--err); min-height: 1.2em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🏢 Agentviewer</h1>
  <p>받은 접속 코드 6자리를 입력하세요</p>
  <input name="code" inputmode="numeric" autocomplete="off" maxlength="6" pattern="\d{6}" required autofocus aria-label="접속 코드">
  <div class="err" role="alert"></div>
  <button type="submit">접속</button>
  <p>관전용 코드는 보기만, 공동작업자 코드는 오케스트레이터에게 지시까지 할 수 있어요</p>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  document.querySelector('.err').textContent = e === 'bad' ? '코드가 맞지 않아요' : e === 'wait' ? '여러 번 틀려서 10분 동안 막혔어요' : '';
</script>
</body>
</html>
